<style>

.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat-card{padding:20px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text2);cursor:pointer;text-align:center;transition:.18s var(--ease);display:flex;flex-direction:column;align-items:center;gap:6px}

.tab{padding:9px 18px;border-radius:10px 10px 0 0;border:1px solid transparent;background:transparent;color:var(--text2);cursor:pointer;font-size:.85rem;font-weight:600;border-bottom:none;transition:.18s var(--ease);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px}

table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:1000px}
th{background:var(--card2);color:var(--text2);font-weight:700;text-align:left;padding:10px 12px;white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--border);user-select:none;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}

td{padding:10px 12px;border-bottom:1px solid rgba(45,49,88,.4);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr{transition:.12s var(--ease)}

.br{background:rgba(239,68,68,.13);color:var(--red);border-color:rgba(239,68,68,.22)}
.bp{background:rgba(124,58,237,.13);color:var(--purpleL);border-color:rgba(124,58,237,.22)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.chart-card{background:var(--card2);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px}
.chart-card h3{font-size:.82rem;color:var(--text2);margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.loading-card{text-align:center;padding:56px 24px}

.step-list{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.step-item{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--r-sm);font-size:.82rem;border:1px solid var(--border);background:var(--card2);color:var(--text3)}
.step-item.done{border-color:var(--green);color:var(--green);background:rgba(16,185,129,.08)}
.step-item.active{border-color:var(--purple);color:var(--purpleL);background:rgba(124,58,237,.08);animation:pulse 1.6s ease-in-out infinite}
.error-box{text-align:center;padding:48px 24px}
.error-box .icon-xl{width:72px;height:72px;border-radius:50%;background:rgba(239,68,68,.12);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto}

@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

.keep-row{display:flex;align-items:center;justify-content:space-between;padding:11px;border-bottom:1px solid var(--border);gap:10px}

.check-item{display:flex;align-items:flex-start;gap:9px;color:var(--text2);font-size:.83rem}
.check-item .icon{color:var(--purpleL);margin-top:1px}
.info-box{background:rgba(124,58,237,.05);border:1px solid rgba(124,58,237,.15);border-radius:var(--r-sm);padding:14px;font-size:.84rem;color:var(--text2);line-height:1.6}

@media(max-width:680px){.metrics-grid{grid-template-columns:1fr 1fr}.charts-grid{grid-template-columns:1fr}.checklist-grid{grid-template-columns:1fr}.manual-grid{grid-template-columns:1fr}.strat-btns{grid-template-columns:1fr}.cat-grid{grid-template-columns:1fr}}
@media(max-width:480px){.brand{flex-direction:column;text-align:center}}
</style>

async function callGemini(systemPrompt, prompt, turnstileToken) {
  const res = await fetch(WORKER_URL + "/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, systemPrompt, turnstileToken })
  });

  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    throw new Error("Error de conexion con el servidor (" + res.status + "): " + txt.slice(0, 200));
  }

  const data = await res.json();
  return data.text || "";
}

function extractJSON(text) {
  const t = text.trim();
  try { return JSON.parse(t); } catch {}
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m) { try { return JSON.parse(m[1].trim()); } catch {} }
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  if (s !== -1 && e > s) { try { return JSON.parse(t.slice(s, e + 1)); } catch {} }
  return null;
}

function normalizeGames(raw, budget) {
  return (raw || [])
    .filter(g =>
      g.name && String(g.name).trim() &&
      +g.fnac_price > 0 && +g.cex_cash_price > 0 && +g.cex_voucher_price > 0 &&
      +g.fnac_price <= budget &&
      String(g.fnac_availability || "").toLowerCase() !== "no disponible"
    )
    .map(g => {
      const fp = +g.fnac_price, cc = +g.cex_cash_price, cv = +g.cex_voucher_price;
      return {
        ...g,
        name: String(g.name).trim(),
        platform: String(g.platform || "Desconocida"),
        fnac_price: fp,
        cex_cash_price: cc,
        cex_voucher_price: cv,
        cash_pct: fp > 0 ? (cc / fp) * 100 : 0,
        voucher_pct: fp > 0 ? (cv / fp) * 100 : 0,
        cash_loss: fp - cc,
        voucher_loss: fp - cv,
        risk: riskOf({ fnac_price: fp, cex_cash_price: cc }),
        qty: g.qty || 1,
      };
    });
}

// ============================================================
// OPTIMIZATION — greedy knapsack
// ============================================================
function scoreFor(g, strategy) {
  if (strategy === "cash")    return g.cex_cash_price;
  if (strategy === "voucher") return g.cex_voucher_price;
  return (g.cex_cash_price + g.cex_voucher_price) / 2;
}

function runGreedy(pool, budget, scoreFn) {
  const sorted = pool
    .map(g => ({ ...g, _d: scoreFn(g) / g.fnac_price }))
    .sort((a, b) => b._d - a._d);

  let rem = budget;
  const out = [];
  const used = new Set();

  for (const g of sorted) {
    if (!used.has(g.name) && rem >= g.fnac_price) {
      out.push({ ...g, qty: 1 });
      rem -= g.fnac_price;
      used.add(g.name);
    }
  }
  // Try to use remaining budget with a 2nd unit
  for (const g of sorted) {
    if (rem < 5) break;
    if (rem >= g.fnac_price) {
      const ex = out.find(x => x.name === g.name);
      if (ex && ex.qty < 2) {
        ex.qty++;
        rem -= g.fnac_price;
      }
    }
  }
  return out;
}

function calcMetrics(games, budget) {
  const totalFnac    = games.reduce((s, g) => s + g.fnac_price * g.qty, 0);
  const totalCash    = games.reduce((s, g) => s + g.cex_cash_price * g.qty, 0);
  const totalVoucher = games.reduce((s, g) => s + g.cex_voucher_price * g.qty, 0);
  const totalUnits   = games.reduce((s, g) => s + g.qty, 0);
  const uniqueGames  = new Set(games.map(g => g.name)).size;
  const diversification   = totalUnits > 0 ? (uniqueGames / totalUnits) * 100 : 0;
  const concentrationRisk = totalUnits > 1 ? ((totalUnits - uniqueGames) / totalUnits) * 100 : 0;
  return {
    games, totalFnac, totalCash, totalVoucher,
    cashLoss: totalFnac - totalCash,
    voucherLoss: totalFnac - totalVoucher,
    cashPct: totalFnac > 0 ? (totalCash / totalFnac) * 100 : 0,
    voucherPct: totalFnac > 0 ? (totalVoucher / totalFnac) * 100 : 0,
    remaining: budget - totalFnac,
    uniqueGames, totalUnits, diversification, concentrationRisk,
  };
}

function generatePossibilities(pool, budget, strategy, count) {
  const strategies = [
    { label: "Maxima recuperacion en efectivo",      fn: g => g.cex_cash_price },
    { label: "Maxima recuperacion en vale CEX",      fn: g => g.cex_voucher_price },
    { label: "Equilibrado efectivo + vale",          fn: g => (g.cex_cash_price + g.cex_voucher_price) / 2 },
    { label: "Maxima diversificacion de cartera",    fn: g => (g.cex_cash_price / g.fnac_price) * 40 + (1 / g.fnac_price) * 200 },
    { label: "Minima perdida porcentual",            fn: g => (g.cex_cash_price / g.fnac_price) * 100 - g.fnac_price * 0.1 },
  ];

  if (strategy === "voucher") [strategies[0], strategies[1]] = [strategies[1], strategies[0]];
  else if (strategy === "balanced") [strategies[0], strategies[2]] = [strategies[2], strategies[0]];

  const results = [];
  const seen = new Set();

  for (let i = 0; i < Math.min(count, strategies.length); i++) {
    const sf = strategies[i];

    // For positions 2+, try excluding the most expensive games from pos 0 to force variety
    let usePool = pool;
    if (i >= 2 && results[0] && pool.length > 4) {
      const top = [...results[0].games].sort((a, b) => b.fnac_price - a.fnac_price).slice(0, Math.ceil(pool.length / 3)).map(g => g.name);
      usePool = pool.filter(g => !top.includes(g.name));
      if (usePool.length < 3) usePool = pool;
    }

    let combo = runGreedy(usePool, budget, sf.fn);
    const key = combo.map(g => g.name + g.qty).sort().join("|");

    if (seen.has(key) && combo.length > 0) {
      const altPool = pool.filter(g => !combo.slice(0, 2).find(x => x.name === g.name));
      const alt = runGreedy(altPool.length >= 2 ? altPool : pool, budget, sf.fn);
      const altKey = alt.map(g => g.name + g.qty).sort().join("|");
      if (!seen.has(altKey)) { combo = alt; seen.add(altKey); }
      else seen.add(key);
    } else {
      seen.add(key);
    }

    results.push({ ...calcMetrics(combo, budget), label: sf.label, rank: i + 1 });
  }

  // Sort by cash recovery descending
  results.sort((a, b) => b.cashPct - a.cashPct);
  return results;
}

// ============================================================
// ARTES EN VIVO, PATRIMONIO Y MEDIOS DE CREACION ARTISTICA (200€)
// Motor paralelo: misma logica de recuperacion/perdida que arriba,
// mas diversificacion con penalizacion por repeticion e historial
// persistente (localStorage) para no recomendar siempre lo mismo.
// ============================================================
const ARTES_HISTORY_KEY = "bonoCultural_artesHistory_v1";
const ARTES_STOPWORDS = new Set(["de","la","el","los","las","con","para","por","un","una","y","en","del","al"]);
const ARTES_REPEAT_PENALTY_STEP = 2;   // puntos restados por cada vez que se ha recomendado antes
const ARTES_REPEAT_PENALTY_CAP = 12;   // tope maximo de penalizacion (nunca puede tapar una gran diferencia de rentabilidad)
const ARTES_LEVEL_BONUS = { alta: 3, media: 1, baja: -2 };

function loadArtesHistory() {
  try {
    const raw = localStorage.getItem(ARTES_HISTORY_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveArtesHistory(history) {
  try { localStorage.setItem(ARTES_HISTORY_KEY, JSON.stringify(history)); } catch {}
}

// Normaliza el nombre para detectar el "mismo modelo" aunque cambie
// ligeramente el nombre comercial o el orden de las palabras.
function normalizeArtesKey(name) {
  const words = String(name || "")
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/)
    .filter(w => w && !ARTES_STOPWORDS.has(w))
    .sort();
  return words.join(" ");
}

function normalizeArtItems(raw, budget) {
  return (raw || [])
    .filter(it =>
      it.name && String(it.name).trim() &&
      +it.purchase_price > 0 && +it.resale_value > 0 &&
      +it.purchase_price <= budget &&
      String(it.purchase_availability || "").toLowerCase() !== "no disponible"
    )
    .map(it => {
      const pp = +it.purchase_price, rv = +it.resale_value;
      return {
        name: String(it.name).trim(),
        platform: String(it.category || "Otros"),   // reutiliza el campo "platform" como categoria/tipo
        brand: String(it.brand || ""),
        fnac_price: pp,          // reutiliza el motor generico: precio de compra
        cex_cash_price: rv,      // reutiliza el motor generico: valor de reventa
        cex_voucher_price: rv,   // este apartado no tiene vale; se refleja el mismo valor real (no se inventa otro)
        fnac_availability: it.purchase_availability || "Disponible",
        fnac_url: it.purchase_url || "",
        cex_url: it.resale_url || "",
        image_url: it.image_url || "",
        resale_market: String(it.resale_market || ""),
        demand_level: String(it.demand_level || "media").toLowerCase(),
        resale_ease: String(it.resale_ease || "media").toLowerCase(),
        valuation_confidence: String(it.valuation_confidence || "media").toLowerCase(),
        cash_pct: pp > 0 ? (rv / pp) * 100 : 0,
        voucher_pct: pp > 0 ? (rv / pp) * 100 : 0,
        cash_loss: pp - rv,
        voucher_loss: pp - rv,
        risk: riskOf({ fnac_price: pp, cex_cash_price: rv }),
        qty: 1,
      };
    });
}

// Puntuacion compuesta: la rentabilidad manda siempre; fiabilidad,
// facilidad de reventa y demanda suman poco; la repeticion resta,
// pero con un tope que jamas puede superar una diferencia grande
// de rentabilidad real (ver ejemplo en el enunciado de la funcionalidad).
function computeArtesScore(item, history) {
  const key = normalizeArtesKey(item.name);
  const timesRecommended = (history[key] && history[key].count) || 0;

  let score = item.cash_pct;
  score += ARTES_LEVEL_BONUS[item.resale_ease] || 0;
  score += ARTES_LEVEL_BONUS[item.demand_level] || 0;
  score += ARTES_LEVEL_BONUS[item.valuation_confidence] || 0;
  score -= Math.min(timesRecommended * ARTES_REPEAT_PENALTY_STEP, ARTES_REPEAT_PENALTY_CAP);

  return score;
}

function runGreedyArtes(pool, budget, history) {
  const sorted = pool
    .map(g => ({ ...g, _score: computeArtesScore(g, history) }))
    .sort((a, b) => b._score - a._score);

  let rem = budget;
  const out = [];
  const used = new Set();

  for (const g of sorted) {
    if (!used.has(g.name) && rem >= g.fnac_price) {
      out.push({ ...g, qty: 1 });
      rem -= g.fnac_price;
      used.add(g.name);
    }
  }
  for (const g of sorted) {
    if (rem < 5) break;
    if (rem >= g.fnac_price) {
      const ex = out.find(x => x.name === g.name);
      if (ex && ex.qty < 2) { ex.qty++; rem -= g.fnac_price; }
    }
  }
  return out;
}

// Genera N posibilidades reutilizando el mismo historial persistente,
// y ademas simula dentro de esta misma tanda que cada producto ya
// elegido "cuenta" para la siguiente posibilidad, para que #2, #3...
// tiendan a variar tambien entre si sin perder rentabilidad real.
function generatePossibilitiesArtes(pool, budget, count) {
  const persistentHistory = loadArtesHistory();
  const runHistory = JSON.parse(JSON.stringify(persistentHistory));
  const results = [];

  for (let i = 0; i < count; i++) {
    const combo = runGreedyArtes(pool, budget, runHistory);
    results.push({ ...calcMetrics(combo, budget), label: "Combinacion #" + (i + 1), rank: i + 1 });

    combo.forEach(g => {
      const key = normalizeArtesKey(g.name);
      const prevCount = (runHistory[key] && runHistory[key].count) || 0;
      runHistory[key] = { count: prevCount + 1, lastSeen: new Date().toISOString(), label: g.name };
    });
  }

  saveArtesHistory(runHistory);
  results.sort((a, b) => b.cashPct - a.cashPct);
  return results;
}

async function analyzeGames() {

  const humanToken = state.turnstileToken;

Nunca inventes precios, disponibilidad ni URLs.
Si no puedes buscar en internet, responde con: {"error":"sin_acceso_web","games":[]}`;

  const now = new Date();
  const nowStr = now.toLocaleString("es-ES", { timeZone: "Europe/Madrid" });
  const isoNow = now.toISOString().slice(0, 19);

  const userMsg = `Fecha y hora actual: ${nowStr}. Presupuesto maximo por unidad: ${state.budget}\u20ac. Tienda de compra: ${si.name} (${si.searchHint}).

Devuelve UNICAMENTE este JSON exacto (sin nada mas, ni antes ni despues):

        "El analisis no puede generarse sin precios actuales confirmados de " + si.name + " y CEX Espana.\n\n" +
        "Causa probable: busqueda web no disponible o error al acceder a las fuentes oficiales.\n" +
        "Prueba el modo manual para introducir precios que hayas verificado tu mismo."
      );
    }

    if (json.error === "sin_acceso_web" || !Array.isArray(json.games)) {
      throw new Error(
        "La busqueda web en tiempo real no esta disponible en este momento.\n" +
        "No se han podido consultar " + si.name + " ni CEX Espana.\n\n" +
        "Usa el modo manual para introducir precios verificados por ti mismo."
      );
    }

    const valid = normalizeGames(json.games, state.budget);

    if (valid.length === 0) {
      throw new Error(
        "No se encontraron juegos verificados con los datos recibidos.\n" +
        "Posibles causas: presupuesto insuficiente, juegos sin precio en CEX, o datos incompletos.\n\n" +
        "Prueba aumentando el presupuesto o usa el modo manual."
      );
    }

    state.loadStep = 4;
    render();

    const poss = generatePossibilities(valid, state.budget, state.strategy, state.possibilities);

    state.data = { ...json, games: valid, possibilities: poss };
    state.analysisTime = now;
    state.selPoss = 0;
    state.screen = "results";
    render();
    setTimeout(initCharts, 160);

  } catch (err) {
    state.error = err.message || String(err);
    state.screen = "error";
    render();
  }
}

{"analysis_datetime":"${isoNow}","timezone":"Europe/Madrid","items":[{"name":"","category":"","brand":"","purchase_price":0,"purchase_availability":"Disponible","purchase_url":"","image_url":"","resale_value":0,"resale_market":"","resale_url":"","demand_level":"media","resale_ease":"media","valuation_confidence":"media","notes":""}],"errors":[]}`;

function sellAdvice(poss) {
  if (!poss?.games?.length) return null;
  const g = poss.games;
  const lowStock  = g.filter(x => String(x.fnac_availability).toLowerCase().includes("pocas")).length;
  const lowReturn = g.filter(x => x.cash_pct < 55).length;
  const hiReturn  = g.filter(x => x.cash_pct >= 85).length;
  const sn = storeInfo().name;

  let rec = "now", conf = "Medio", reason = "";
  if (lowStock >= 2) {
    rec = "now"; conf = "Alto";
    reason = `${lowStock} juego(s) con pocas unidades en ${sn}. Conviene actuar pronto.`;
  } else if (hiReturn >= 2) {
    rec = "now"; conf = "Medio";
    reason = "Varios juegos con alta rentabilidad. Buen momento para ejecutar la estrategia.";
  } else if (lowReturn > g.length / 2) {
    rec = "wait"; conf = "Bajo";
    reason = "Varios juegos con baja recuperacion. Considera esperar a que CEX mejore sus precios.";
  } else {
    rec = "now"; conf = "Medio";
    reason = "Los precios actuales son razonables para ejecutar la estrategia.";
  }

  return {
    rec, conf, reason,
    riskPrice: lowReturn > 0 ? "Alto" : "Medio",
    riskStock: lowStock > 0 ? "Alto" : "Bajo",
    riskCex:   g.some(x => x.cash_pct < 50) ? "Alto" : "Medio",
  };
}

}

  destroyCharts();
  const poss = state.data?.possibilities?.[state.selPoss];

  const g = poss.games;

  const base = {
    responsive: true,
    maintainAspectRatio: true,
    plugins: { legend: { labels: { color: "#94a3b8", font: { size: 10 } } } },
    scales: {
      x: { ticks: { color: "#64748b", font: { size: 9 } }, grid: { color: "#1a1d35" } },

  const c1 = document.getElementById("ch-cmp");

      type: "doughnut",

// ============================================================
// RENDER ENGINE
// ============================================================
function render() {
  const app = document.getElementById("app");
  if (!app) return;

  let html = '<div class="app">';
  if (state.screen === "category")     html += renderCategory();
  if (state.screen === "setup")        html += renderSetup();
  if (state.screen === "loading")      html += renderLoading();
  if (state.screen === "results")      html += renderResults();
  if (state.screen === "error")        html += renderError();
  if (state.screen === "manual")       html += renderManual();
  if (state.screen === "setupArtes")   html += renderSetupArtes();
  if (state.screen === "loadingArtes") html += renderLoadingArtes();
  if (state.screen === "resultsArtes") html += renderResultsArtes();
  if (state.screen === "errorArtes")   html += renderErrorArtes();
  if (state.showModal)                 html += renderModal();
  html += "</div>";

  app.innerHTML = html;
  bindEvents();

  if (state.screen === "results")      setTimeout(initCharts, 140);
  if (state.screen === "resultsArtes") setTimeout(initChartsArtes, 140);
  if (["setup", "error", "results", "setupArtes", "errorArtes", "resultsArtes"].includes(state.screen)) setTimeout(mountTurnstile, 50);
}

function renderTable(games) {
  const q = state.searchQ.toLowerCase();
  const sn = storeInfo().name;
  let rows = games.filter(g => {
    const ms = !q || g.name.toLowerCase().includes(q) || g.platform.toLowerCase().includes(q);
    const mp = state.filterPlatform === "all" || g.platform === state.filterPlatform;
    return ms && mp;
  });

  rows = [...rows].sort((a, b) => {
    const f = state.sortField;
    const va = f==="name" ? a.name.localeCompare(b.name) : (b[f] - a[f]);
    return state.sortDir === "asc" ? -va : va;
  });

  if (!rows.length) return `<div style="text-align:center;padding:28px;color:var(--text3)">Ningun juego coincide con los filtros</div>`;

  const thArr = [
    ["",         ""],
    ["name",     "Juego"],
    ["",         "Plataforma"],
    ["",         "Uds"],
    ["fnac_price","Precio " + sn],
    ["",         sn + " Total"],
    ["",         "Disponibilidad"],
    ["",         "CEX Ef./ud"],
    ["",         "CEX Vale/ud"],
    ["",         "CEX Ef. Total"],
    ["cash_loss","Perdida Ef."],
    ["cash_pct", "% Rec."],
    ["",         "Riesgo"],
    ["",         "Links"],
  ];

  const thead = `<thead><tr>${thArr.map(([f, lbl]) =>
    `<th ${f?`data-th="${f}"`:""}>${lbl}</th>`
  ).join("")}</tr></thead>`;

  const tbody = `<tbody>${rows.map(g => {
    const rb = retBadge(g.cash_pct);
    const risk = g.risk || riskOf(g);
    const avail = String(g.fnac_availability || "");
    const availCls = avail.toLowerCase().includes("pocas") ? "by" : avail.toLowerCase().includes("disponible") ? "bg" : "br";
    return `<tr>
      <td>${g.image_url ? `<img src="${esc(g.image_url)}" class="img-thumb" onerror="this.style.display='none'"><span class="img-ph" style="display:none">${platformIcon()}</span>` : `<div class="img-ph">${platformIcon()}</div>`}</td>
      <td style="max-width:220px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(g.name)}">${esc(g.name)}</td>
      <td><span class="badge bp">${esc(g.platform)}</span></td>
      <td style="text-align:center">${g.qty}</td>
      <td>${fmt(g.fnac_price)}</td>
      <td>${fmt(g.fnac_price * g.qty)}</td>
      <td><span class="badge ${availCls}">${esc(avail || "Desconocida")}</span></td>
      <td style="color:var(--green)">${fmt(g.cex_cash_price)}</td>
      <td style="color:var(--purpleL)">${fmt(g.cex_voucher_price)}</td>
      <td style="color:var(--green)">${fmt(g.cex_cash_price * g.qty)}</td>
      <td style="color:var(--red)">-${fmt(g.cash_loss)}</td>
      <td><span class="badge ${rb.cls}">${rb.ic ? icon(rb.ic,{size:11}) : ""}${rb.label} (${g.cash_pct.toFixed(0)}%)</span></td>
      <td><span class="badge ${risk.cls}">${risk.label}</span></td>
      <td style="white-space:nowrap">
        ${g.fnac_url ? `<a href="${esc(g.fnac_url)}" target="_blank" class="link-a">${esc(sn)} ${icon("externalLink",{size:12})}</a> ` : ""}
        ${g.cex_url  ? `<a href="${esc(g.cex_url)}"  target="_blank" class="link-a p">CEX ${icon("externalLink",{size:12})}</a>` : ""}
      </td>
    </tr>`;
  }).join("")}</tbody>`;

  return `<table>${thead}${tbody}</table>`;
}

function renderSell(poss, adv) {
  if (!adv) return "";
  const map = {
    now:  { cls:"now",  ic:"checkCircle", lbl:"Comprar y vender ahora" },
    wait: { cls:"wait", ic:"clock",       lbl:"Comprar ahora y esperar a vender" },
    no:   { cls:"no",   ic:"xCircle",     lbl:"No comprar todavia" },
  };
  const r = map[adv.rec] || map.now;

  function riskPill(level, label, ic) {
    const fillCls = level==="Alto" ? "risk-fill-high" : level==="Bajo" ? "risk-fill-low" : "risk-fill-med";
    const badgeCls = level==="Alto" ? "c-red" : level==="Bajo" ? "c-green" : "c-yellow";
    return `<div class="risk-item">
      <h4>${icon(ic,{size:13})} ${label}</h4>
      <strong class="${badgeCls}">${level}</strong>
      <div class="risk-bar"><div class="${fillCls}"></div></div>
    </div>`;
  }

  return `
<div class="card">
  <div class="sec-title">${icon("lightbulb",{size:18})} Vender ahora o esperar</div>
  <div class="sell-box">
    <div class="sell-rec ${r.cls}">
      <div class="rec-icon">${icon(r.ic,{size:22})}</div>
      <div>
        <strong style="font-size:1rem">${r.lbl}</strong>
        <p style="color:var(--text2);font-size:.85rem;margin-top:5px">${esc(adv.reason)}</p>
        <p style="font-size:.78rem;color:var(--text3);margin-top:4px">Nivel de confianza: <strong>${adv.conf}</strong></p>
      </div>
    </div>
    <div class="risk-grid">
      ${riskPill(adv.riskPrice, "Riesgo cambio de precio", "trendingDown")}
      ${riskPill(adv.riskStock, "Riesgo falta de stock", "package")}
      ${riskPill(adv.riskCex,   "Riesgo bajada CEX", "store")}
      ${riskPill("Medio",       "Riesgo edicion/plataforma", "clipboard")}
    </div>
    <p style="font-size:.75rem;color:var(--text3);margin-top:12px">
      ${icon("alertTriangle",{size:13})} No existen datos oficiales suficientes para predecir la evolucion futura de estos precios. Esta recomendacion se basa exclusivamente en el estado actual del mercado.
    </p>
  </div>
</div>`;
}

  return `

          <div style="font-size:.78rem;color:var(--text2)">${esc(g.platform)} &mdash; ${fmt(g.fnac_price)} &mdash; Rec: ${g.cash_pct.toFixed(0)}%</div>

        <div class="keep-btns">
          <button class="kbtn ${st==="keep"?"keep":""}"    data-game="${esc(g.name)}" data-act="keep">Mantener</button>
          <button class="kbtn ${st==="remove"?"remove":""}" data-game="${esc(g.name)}" data-act="remove">Eliminar</button>
          <button class="kbtn ${st==="replace"?"replace":""}" data-game="${esc(g.name)}" data-act="replace">Sustituir</button>

    <div style="margin:14px 0;padding:12px;background:var(--card2);border-radius:8px;font-size:.85rem;color:var(--text2)">

  </div>
</div>`;
}

function renderDashArtes(p) {
  const m = [
    { v: fmt(state.artesBudget),       l:"Presupuesto",          c:"c-blue",  ic:"wallet"      },
    { v: fmt(p.totalFnac),             l:"Gasto total",          c:"",        ic:"store"       },
    { v: fmt(p.remaining),             l:"Resto presupuesto",    c: p.remaining >= 0 ? "c-green" : "c-red", ic:"wallet" },
    { v: fmt(p.totalCash),             l:"Recuperado (reventa)", c:"c-green", ic:"banknote"    },
    { v: (p.cashLoss>0?"-":"+") + fmt(Math.abs(p.cashLoss)), l:"Perdida", c: p.cashLoss>0?"c-red":"c-green", ic:"trendingDown" },
    { v: p.cashPct.toFixed(1)+"%",     l:"Rentabilidad",         c: p.cashPct>=80?"c-green":p.cashPct>=60?"c-yellow":"c-red", ic:"barChart" },
    { v: p.uniqueGames,                l:"Productos distintos",  c:"c-blue",  ic:"sparkles"    },
    { v: p.totalUnits,                 l:"Unidades totales",     c:"",        ic:"package"     },
    { v: p.diversification.toFixed(0)+"%", l:"Diversificacion",  c: p.diversification>=80?"c-green":"c-yellow", ic:"target" },
  ];
  return `<div class="metrics-grid">${m.map(x=>`
    <div class="metric">
      <div class="metric-top"><span class="metric-lbl">${x.l}</span>${icon(x.ic,{size:14})}</div>
      <div class="metric-val ${x.c}">${x.v}</div>
    </div>`).join("")}</div>`;
}

function renderTableArtes(items) {
  const history = loadArtesHistory();
  const rows = [...items].sort((a, b) => b.cash_pct - a.cash_pct);

  if (!rows.length) return `<div style="text-align:center;padding:28px;color:var(--text3)">Ningun producto en esta combinacion</div>`;

  const thead = `<thead><tr>
    <th></th><th>Producto</th><th>Categoria</th><th>Marca</th><th>Uds</th><th>Precio compra</th><th>Disponibilidad</th><th>Valor reventa</th><th>Perdida</th><th>% Rec.</th><th>Riesgo</th><th>Historial</th><th>Links</th>
  </tr></thead>`;

  const tbody = `<tbody>${rows.map(g => {
    const rb = retBadge(g.cash_pct);
    const risk = g.risk || riskOf(g);
    const avail = String(g.fnac_availability || "");
    const availCls = avail.toLowerCase().includes("pocas") ? "by" : avail.toLowerCase().includes("disponible") ? "bg" : "br";
    const key = normalizeArtesKey(g.name);
    const seenCount = (history[key] && history[key].count) || 0;
    return `<tr>
      <td>${g.image_url ? `<img src="${esc(g.image_url)}" class="img-thumb" onerror="this.style.display='none'"><span class="img-ph" style="display:none">${platformIcon()}</span>` : `<div class="img-ph">${platformIcon()}</div>`}</td>
      <td style="max-width:200px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(g.name)}">${esc(g.name)}</td>
      <td><span class="badge bp">${esc(g.platform)}</span></td>
      <td style="color:var(--text2)">${esc(g.brand || "-")}</td>
      <td style="text-align:center">${g.qty}</td>
      <td>${fmt(g.fnac_price)}</td>
      <td><span class="badge ${availCls}">${esc(avail || "Desconocida")}</span></td>
      <td style="color:var(--green)">${fmt(g.cex_cash_price)}</td>
      <td style="color:var(--red)">-${fmt(g.cash_loss)}</td>
      <td><span class="badge ${rb.cls}">${rb.ic ? icon(rb.ic,{size:11}) : ""}${rb.label} (${g.cash_pct.toFixed(0)}%)</span></td>
      <td><span class="badge ${risk.cls}">${risk.label}</span></td>
      <td>${seenCount > 1 ? `<span class="badge by">Recomendado ×${seenCount}</span>` : `<span class="badge bg">Nuevo</span>`}</td>
      <td style="white-space:nowrap">
        ${g.fnac_url ? `<a href="${esc(g.fnac_url)}" target="_blank" class="link-a">Comprar ${icon("externalLink",{size:12})}</a> ` : ""}
        ${g.cex_url  ? `<a href="${esc(g.cex_url)}"  target="_blank" class="link-a p">Reventa ${icon("externalLink",{size:12})}</a>` : ""}
      </td>
    </tr>`;
  }).join("")}</tbody>`;

  return `<table>${thead}${tbody}</table>`;
}

// ============================================================
// EVENT BINDING
// ============================================================
function bindEvents() {
  const $ = id => document.getElementById(id);
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };

  // Apartado del Bono Cultural
  document.querySelectorAll("[data-cat]").forEach(el =>
    el.addEventListener("click", () => {
      state.screen = el.dataset.cat === "artes" ? "setupArtes" : "setup";
      render();
    })
  );

  // Setup
  on("budget-in", "input", e => { state.budget = parseFloat(e.target.value) || 150; });
  on("store-select", "change", e => { state.store = e.target.value; render(); });
  on("btn-analyze",  "click", analyzeGames);
  on("btn-to-manual","click", () => { state.screen = "manual"; render(); });

  // Setup — Artes en vivo (200€)
  on("btn-analyze-artes", "click", analyzeArtItems);
  on("btn-back-artes", "click", () => { state.screen = "category"; render(); });
  document.querySelectorAll("[data-poss-artes]").forEach(el =>
    el.addEventListener("click", () => { state.artesPossibilities = +el.dataset.possArtes; render(); })
  );

  // Error / resultados — Artes en vivo
  on("btn-retry-artes", "click", analyzeArtItems);
  on("btn-reanalyze-artes", "click", analyzeArtItems);
  document.querySelectorAll("#btn-back-artes-params").forEach(el =>
    el.addEventListener("click", () => { state.screen = "setupArtes"; render(); })
  );
  document.querySelectorAll("[data-tab-artes]").forEach(el =>
    el.addEventListener("click", () => { state.artesSelPoss = +el.dataset.tabArtes; render(); })
  );

  // Strategy pills
  document.querySelectorAll("[data-strategy]").forEach(el =>
    el.addEventListener("click", () => { state.strategy = el.dataset.strategy; render(); })
  );

  // Possibility count
  document.querySelectorAll("[data-poss]").forEach(el =>
    el.addEventListener("click", () => { state.possibilities = +el.dataset.poss; render(); })
  );

  // Error screen
  on("btn-retry",     "click", analyzeGames);
  on("btn-to-manual", "click", () => { state.screen = "manual"; render(); });

  // Back / reanalyze (shared id across screens)
  document.querySelectorAll("#btn-back").forEach(el =>
    el.addEventListener("click", () => { state.screen = "setup"; render(); })
  );
  on("btn-reanalyze", "click", analyzeGames);

  // Tabs
  document.querySelectorAll("[data-tab]").forEach(el =>
    el.addEventListener("click", () => { state.selPoss = +el.dataset.tab; render(); })
  );

  // Filters
  on("f-search", "input", e => { state.searchQ = e.target.value; render(); });
  on("f-plat",   "change", e => { state.filterPlatform = e.target.value; render(); });
  on("f-sort",   "change", e => { state.sortField = e.target.value; render(); });

  // Table sort
  document.querySelectorAll("th[data-th]").forEach(el =>
    el.addEventListener("click", () => {
      const f = el.dataset.th;
      if (state.sortField === f) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      else { state.sortField = f; state.sortDir = "desc"; }
      render();
    })
  );

  // Results actions
  on("btn-pdf",     "click", exportPDF);
  on("btn-replace", "click", () => { state.showModal = true; state.replaceStatus = {}; render(); });

  // Modal
  on("btn-modal-cancel", "click", () => { state.showModal = false; render(); });
  on("modal-ov", "click", e => { if (e.target.id === "modal-ov") { state.showModal = false; render(); } });
  on("btn-modal-ok", "click", () => {
    state.showModal = false;
    const poss = state.data?.possibilities?.[state.selPoss];
    if (!poss) { render(); return; }

    const kept = poss.games.filter(g => (state.replaceStatus[g.name] || "keep") === "keep");
    const keptBudget = kept.reduce((s,g) => s + g.fnac_price * g.qty, 0);
    const remBudget  = state.budget - keptBudget;

    if (remBudget < 5) {
      alert("No hay presupuesto disponible para buscar sustitutos.");
      render(); return;
    }

    const usedNames = new Set(kept.map(g => g.name));
    const pool = (state.data.games || []).filter(g => !usedNames.has(g.name));
    const subs = runGreedy(pool, remBudget, g => g.cex_cash_price);
    const merged = [...kept, ...subs];
    const updated = { ...calcMetrics(merged, state.budget), label: "Personalizado (mantener + sustitutos)", rank: state.selPoss + 1 };
    state.data.possibilities[state.selPoss] = updated;
    state.replaceStatus = {};
    render();
  });

  // Modal keep/remove/replace buttons
  document.querySelectorAll("[data-game][data-act]").forEach(el =>
    el.addEventListener("click", () => { state.replaceStatus[el.dataset.game] = el.dataset.act; render(); })
  );

  // Manual mode
  on("m-store", "change", e => { state.store = e.target.value; render(); });
  on("btn-m-add", "click", () => {
    const name  = $("m-name")?.value?.trim();
    const plat  = $("m-plat")?.value;
    const fp    = parseFloat($("m-fp")?.value);
    const avail = $("m-avail")?.value;
    const cc    = parseFloat($("m-cc")?.value);
    const cv    = parseFloat($("m-cv")?.value);
    const fu    = $("m-fu")?.value?.trim();
    const cu    = $("m-cu")?.value?.trim();

    if (!name || isNaN(fp) || isNaN(cc) || isNaN(cv)) {
      alert("Completa al menos: nombre, precio " + storeInfo().name + ", CEX efectivo y CEX vale."); return;
    }

    const g = { name, platform: plat, fnac_price: fp, fnac_availability: avail, cex_cash_price: cc, cex_voucher_price: cv, fnac_url: fu, cex_url: cu, image_url: "", verification_status: "manual", notes: "Verificado manualmente por el usuario", qty: 1 };
    const norm = normalizeGames([g], state.budget);
    if (norm.length) { state.manualGames.push(norm[0]); render(); }
    else alert("El juego no paso la validacion (precio " + storeInfo().name + " superior al presupuesto o datos incompletos).");
  });

  document.querySelectorAll("[data-rm]").forEach(el =>
    el.addEventListener("click", () => { state.manualGames.splice(+el.dataset.rm, 1); render(); })
  );

  on("btn-m-calc", "click", () => {
    if (!state.manualGames.length) { alert("Anade al menos un juego."); return; }
    const b = parseFloat($("m-budget")?.value) || state.budget;
    const s = $("m-strat")?.value || state.strategy;
    const c = +($("m-poss")?.value || 3);
    const st = $("m-store")?.value || state.store;
    state.budget = b; state.strategy = s; state.possibilities = c; state.store = st;

    const poss = generatePossibilities(state.manualGames, b, s, c);
    state.data = {
      analysis_datetime: new Date().toISOString().slice(0,19),
      timezone: "Europe/Madrid",
      sources_used: ["Manual (usuario)"],
      games: state.manualGames,
      possibilities: poss,
      excluded_games: [],
      errors: [],
    };
    state.analysisTime = new Date();
    state.selPoss = 0;
    state.screen = "results";
    render();
  });
}

// ============================================================
// INIT
// ============================================================
render();
